# 전체 시스템 설정 (경로, 사용 모듈 on/off)

project_root: .

test_data_dir:
  root: tests/test_data
  images: tests/test_data/image0
  lidar: tests/test_data/lidar
  gps: tests/test_data/gps
  outputs: tests/outputs

  calibration:
    calib_Camera: tests/test_data/calib_Camera0.txt
    calib_LiDAR_Camera: tests/test_data/calib_CameraToLidar0.txt
    calib_LiDAR_Imu: tests/test_data/calib_LidarToImu.txt
    initial_location: tests/test_data/pos_ENU0.txt

dataset_id: "043"
root: data/raw/${dataset_id}

dataset_dir:
  images: ${root}/image0
  lidar: ${root}/lidar
  gps: ${root}/gps
  outputs: ${root}/outputs

  calibration:
    calib_Camera: ${root}/calib_Camera0.txt
    calib_LiDAR_Camera: ${root}/calib_CameraToLidar0.txt
    calib_LiDAR_Imu: ${root}/calib_LidarToImu.txt
    initial_location: ${root}/pos_ENU0.txt

# 2880x1860 용 bev
bev:
  resolution: 0.01      # [m/px]
  front: 18.6             # [m]
  back: 0               # [m]
  left: 14.4              # [m]
  right: 14.4             # [m]
  ground_z: -1.8       # [m]

# 1920x1220 용 bev
# bev:
#   resolution: 0.01      # [m/px]
#   front: 15             # [m]
#   back: 0               # [m]
#   left: 10              # [m]
#   right: 10             # [m]
#   ground_z: -1.70       # [m]

# hysteresis / manager tuning
risk_zone_manager:
  enter_threshold: 2
  exit_threshold: 3
  history_len: 20
  # defaults for BEV risk zone generation (used by PedestrianStateManager.set_zones_from_gps)
  width_m: 1.25
  min_front: 8.0
  max_front: 15.0
  # how many prediction samples to consider when evaluating worst-case severity
  prediction_samples: 20
  # when leaving RISK into CAUTION, require this many frames before committing the CAUTION state
  risk_to_caution_hold: 2

