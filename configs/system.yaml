# 전체 시스템 설정 (경로, 사용 모듈 on/off)

project_root: .

test_data_dir:
  root: tests/test_data
  images: tests/test_data/image0
  lidar: tests/test_data/lidar
  gps: tests/test_data/gps
  outputs: tests/outputs

  calibration:
    calib_Camera: tests/test_data/calib_Camera0.txt
    calib_LiDAR_Camera: tests/test_data/calib_CameraToLidar0.txt
    calib_LiDAR_Imu: tests/test_data/calib_LidarToImu.txt
    initial_location: tests/test_data/pos_ENU0.txt

dataset_id: "043"
root: data/raw/${dataset_id}

dataset_dir:
  images: ${root}/image0
  lidar: ${root}/lidar
  gps: ${root}/gps
  outputs: ${root}/outputs

  calibration:
    calib_Camera: ${root}/calib_Camera0.txt
    calib_LiDAR_Camera: ${root}/calib_CameraToLidar0.txt
    calib_LiDAR_Imu: ${root}/calib_LidarToImu.txt
    initial_location: ${root}/pos_ENU0.txt

# UI 플랫폼용 데이터 경로 설정
# 각 팀원이 자신의 데이터 경로로 수정해서 사용
data:
  sequence_dir: ""  # 예: /path/to/13_전방 보행자_val

bev:
  resolution: 0.01      # [m/px]
  front: 15            # [m]
  back: 0              # [m]
  left: 10              # [m]
  right: 10             # [m]
  ground_z: -1.67       # [m]